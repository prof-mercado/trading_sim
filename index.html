<style>
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;background:#0D2129;color:#63666A;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;touch-action:manipulation;cursor:pointer}

input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}

.anim .fade-in{animation:fadeIn .4s ease-out both}
.anim .slide-up{animation:fadeIn .5s ease-out both}
.pulse{animation:pulse 1.5s infinite}
.screen{min-height:100vh}
.wrap{max-width:600px;margin:0 auto}
.pad{padding:16px}
.light{background:#F7F8FA}
.center{text-align:center}
.eyebrow{font-size:11px;font-weight:bold;letter-spacing:3px;color:#72BF44}
.lnk{background:none;border:none;font-size:13px;font-weight:bold;color:#B1E4E3;padding:6px 0}

.btn{width:100%;padding:14px;border-radius:8px;font-weight:bold;font-size:15px;border:none;background:#154734;color:#FFFFFF}

.btn.warn{background:#C0392B;color:#FFFFFF}
.row2{display:flex;gap:8px}
.row2>*{flex:1}
.note{font-size:11px;color:#63666A;text-align:center;margin-top:8px;line-height:1.4}

.card{padding:14px;border-radius:10px;background:#FFFFFF;border:1px solid #D6D1CA;margin-bottom:10px}
.tint{padding:12px;border-radius:8px;background:rgba(177,228,227,.4);margin-bottom:12px}
.tint.bar{border-left:4px solid #154734}

/* welcome */
.welcome{display:flex;align-items:center;justify-content:center;padding:24px;background:#003B49}
.welcome h1{font-size:32px;color:#FFFFFF;margin:12px 0;line-height:1.2}

/* header */

/* questions */

.hint.onc{color:#FFFFFF;opacity:.85}
.qprompt{font-size:14px;font-weight:bold;color:#154734;margin-bottom:10px;line-height:1.4}
.news{display:flex;align-items:center;justify-content:center;padding:20px}
.news .inner{max-width:560px;width:100%;text-align:center;color:#FFFFFF}
.news .live{font-size:12px;font-weight:bold;letter-spacing:4px;margin-bottom:10px;opacity:.85}
.news .tag{font-size:13px;font-weight:bold;letter-spacing:3px;margin-bottom:18px;padding:6px 14px;background:rgba(255,255,255,.18);border-radius:4px;display:inline-block}
.news .head{font-size:22px;font-weight:bold;line-height:1.3;margin-bottom:18px}
.news .qprompt{color:#FFFFFF;text-align:left}
.news .desc{font-size:14px;opacity:.95;line-height:1.6;margin-bottom:18px}
.btn.white{background:#FFFFFF}

/* results */
.rhead{border-radius:12px;overflow:hidden;border:2px solid #154734;margin-bottom:16px;background:#FFFFFF}
.rtop{padding:18px;text-align:center;background:#003B49}

.grid2{display:grid;grid-template-columns:1fr 1fr}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr}
.cell{padding:14px 8px;text-align:center}
.cell b{display:block;font-size:26px}
.cell small{font-size:10px;color:#B1E4E3}

.legend b{font-weight:bold}
.sw{display:inline-block;width:22px;height:0;border-top:3px solid #154734;vertical-align:middle;margin-right:5px}
.sw.m{border-top:3px dashed #005F83}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{font-size:9px;letter-spacing:1px;text-align:right;color:#63666A;padding:3px 0;font-weight:bold}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{text-align:right;padding:3px 0;border-top:1px solid #F0F2F5}
.tbl td b{color:#154734}
.tbl tr.fin td{border-top:2px solid #154734;font-weight:bold;color:#154734}
.lesson{display:flex;gap:10px;align-items:flex-start}
.num{width:28px;height:28px;border-radius:50%;background:#154734;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:14px;color:#FFFFFF;flex-shrink:0}
textarea{width:100%;min-height:120px;padding:12px;border-radius:8px;border:2px solid #D6D1CA;line-height:1.5;resize:vertical;outline:none;transition:border-color .3s;color:#333}
textarea.ok{border-color:#72BF44}
.count{font-size:11px;margin-top:4px;line-height:1.4}
.count.ok{color:#2F7D1F;font-weight:bold}
.rsec{padding:12px 14px;background:#F7F8FA;border-top:1px solid #D6D1CA}
.rsec small{display:block;font-size:9px;font-weight:bold;letter-spacing:1px;color:#005F83;margin-bottom:4px}
.rsec div{font-size:12px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:break-word}
.ver{font-size:10px;color:#B1E4E3;opacity:.7;margin-top:16px}
noscript{display:block;padding:24px;color:#FFFFFF;text-align:center}
</style>

<body>
<noscript>This simulation needs JavaScript. Please turn it on in your browser settings and reload the page.</noscript>
<div id="root"></div>
<script>
(function(){
"use strict";
var VERSION="2.0";
var KEY="fin2150_trading_sim_v2";
var START=10000;
var MINWORDS=20;

var STOCKS=["TECH","BANK","ENERGY","RETAIL","HEALTH"];
var SECTORS={TECH:"Technology",BANK:"Banking",ENERGY:"Energy",RETAIL:"Retail",HEALTH:"Healthcare"};

var ROUNDS=[
  {bid:[150,45,80,25,120],ask:[150.10,45.05,80.08,25.04,120.12],chg:["--","--","--","--","--"],chgPct:[0,0,0,0,0]},
  {bid:[165,44.50,79,25.25,120.50],ask:[165.10,44.55,79.08,25.29,120.62],chg:["+10.0%","-1.1%","-1.2%","+1.0%","+0.4%"],chgPct:[10,-1.1,-1.2,1,0.4]},
  {bid:[148.50,49,74,23.50,118],ask:[148.60,49.05,74.08,23.54,118.12],chg:["-10.0%","+10.1%","-6.3%","-6.9%","-2.1%"],chgPct:[-10,10.1,-6.3,-6.9,-2.1]},
  {bid:[153,47,76,24.50,132],ask:[153.10,47.05,76.08,24.54,132.12],chg:["+3.0%","-4.1%","+2.7%","+4.3%","+11.9%"],chgPct:[3,-4.1,2.7,4.3,11.9]}
];

var NEWS=[
  {headline:"",description:"Study these prices carefully and decide how to allocate your $10,000 starting capital.",color:"#005F83"},
  {headline:"BREAKING NEWS: Major tech company beats earnings expectations by 20%. Entire tech sector rallying on positive sentiment!",
   description:"The market has responded instantly to this earnings announcement. Look closely at how dramatically TECH jumped -- from $150 to $165 in seconds.",color:"#154734",
   q:{prompt:"Before you see the prices: you want to buy TECH on this news. What will it cost you?",
      options:["About $150. The news just broke, so I can still get in early.","Well above $150. The price has already moved.","Below $150. Good news like this is usually expected already."],
      correct:1,
      explain:"TECH already costs $165.10 to buy. The price moved the instant the news became public, before anyone reading the headline could act."}},
  {headline:"BREAKING NEWS: Federal Reserve unexpectedly raises interest rates by 0.5%. Broad market selloff underway! Banking sector benefits from higher rates.",
   description:"Higher interest rates typically pressure growth stocks while benefiting financial institutions.",color:"#C0392B",
   q:{prompt:"Before you see the prices: TECH jumped 10% last round. What does that tell you about TECH this round?",
      options:["It has momentum. It will keep rising.","It rose too fast. It is due for a fall.","Nothing. Last round's move does not predict this one."],
      correct:2,
      explain:"TECH fell 10.0% this round, but not because it rose last round. New information (the Fed) moved it. Past price changes do not predict future ones: that is the weak form of the EMH."}},
  {headline:"BREAKING NEWS: FDA approves revolutionary new drug treatment. Healthcare sector surging! Broader market recovering from earlier selloff.",
   description:"The healthcare sector is experiencing a major rally. This is your final opportunity to adjust your portfolio.",color:"#27AE60",
   q:{prompt:"Before you see the prices: who could have profited from this FDA news?",
      options:["Anyone who reads the headline and buys HEALTH right away.","Only someone who knew before the announcement, and trading on that is illegal.","Anyone who studied HEALTH's price changes in earlier rounds."],
      correct:1,
      explain:"HEALTH already costs $132.12 to buy, up 11.9%. Only someone who had the news before it was public could have profited, and trading on material non-public information is illegal insider trading (Securities Exchange Act of 1934, Rule 10b-5)."}}
];

var DEBRIEFS=[
  null,
  {title:"Quick Debrief: The Speed of Information",emhTag:"Semi-Strong Form EMH in Action",items:[
    {n:"01",t:"Notice the Instant Price Jump",b:"TECH rocketed from $150 to $165 the moment the news hit. There was no gradual climb -- the price adjusted instantly as algorithms reacted faster than humanly possible."},
    {n:"02",t:"Did Anyone Actually Profit?",b:"By the time you heard the announcement and discussed strategy, the price had already moved. If you bought TECH after hearing the news, you paid $165, not $150."},
    {n:"03",t:"Semi-Strong Form EMH",b:"This is exactly what the semi-strong form predicts: all public information (like earnings announcements) is instantly reflected in prices. You cannot profit from news that everyone else also has."},
    {n:"04",t:"The Critical Lesson",b:"The only way to profit from the TECH jump would have been to buy BEFORE the announcement. But that would require inside information (illegal) or pure luck."}
   ],
   q:{prompt:"Check: the semi-strong form of the EMH says prices already reflect...",
      options:["Past prices only.","All publicly available information.","All information, public and private."],
      correct:1,
      explain:"Semi-strong form: all public information, like this earnings news, is already in the price. \"Past prices only\" is the weak form; \"public and private\" is the strong form."}},
  {title:"Quick Debrief: Volatility & Emotions",emhTag:"Why Diversification Matters",items:[
    {n:"01",t:"The Crash",b:"TECH plummeted from $165 to $148.50, wiping out all gains from Round 1. This is the kind of volatility that causes investors to panic."},
    {n:"02",t:"The Unexpected Winner",b:"While everything else fell, BANK surged 10%. Higher interest rates mean banks earn more on loans and deposits. Different sectors respond differently to the same macro news."},
    {n:"03",t:"EMH Connection",b:"If markets are efficient, you cannot predict which sector will win next. The Fed announcement was a surprise -- no amount of analysis could have told you to sell TECH and buy BANK before it happened."},
    {n:"04",t:"The Emotional Challenge",b:"The ability to remain calm during volatility separates successful investors from unsuccessful ones. Panic selling locks in losses. This is why passive, diversified strategies outperform active trading."}
   ],
   q:{prompt:"Check: BANK rose 10.1% while TECH fell 10.0%. If you cannot predict which sector wins next, what protects you?",
      options:["Moving everything into last round's winner.","Owning several sectors at once (diversification).","Trading more often to catch each move."],
      correct:1,
      explain:"Diversification. If surprises cannot be predicted, holding several sectors means one surprise cannot sink the whole portfolio. Trading more often only pays the spread more often."}},
  null
];

var PLANS=["Spread my money across most or all five sectors","Concentrate on one or two sectors I like","Keep a large share in cash and wait"];

// The fixed path through the simulation. Students can step back to review any earlier step.
var STEPS=[{t:"trade",r:0},{t:"news",r:1},{t:"trade",r:1},{t:"debrief",r:1},{t:"news",r:2},{t:"trade",r:2},{t:"debrief",r:2},{t:"news",r:3},{t:"trade",r:3},{t:"results"},{t:"reflect"},{t:"card"}];
var QKEYS=["n1","d1","n2","d2","n3"];

function r2(x){return Math.round(x*100)/100;}
function fmt(n){return "$"+r2(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,",");}
function pct(n){return (n>=0?"+":"")+n.toFixed(1)+"%";}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function valueAt(cash,shares,r){var v=cash;for(var i=0;i<5;i++){v+=shares[i]*ROUNDS[r].bid[i];}return r2(v);}

// Buy-and-hold benchmark: $2,000 in each stock at the Round 0 ask, whole shares, valued at each round's bid.
var BENCH=(function(){
  var sh=[],left=START,spread=0,i;
  for(i=0;i<5;i++){sh[i]=Math.floor((START/5)/ROUNDS[0].ask[i]);left-=sh[i]*ROUNDS[0].ask[i];spread+=sh[i]*(ROUNDS[0].ask[i]-ROUNDS[0].bid[i]);}
  var vals=ROUNDS.map(function(R,r){return valueAt(left,sh,r);});
  return {vals:vals,spread:r2(spread),ret:(vals[3]-START)/START*100};
})();

// ---------- state ----------
function fresh(){return {v:2,started:false,name:"",pos:0,maxPos:0,cash:START,shares:[0,0,0,0,0],
  roundStart:{cash:START,shares:[0,0,0,0,0]},log:[],snaps:[],plan:null,answers:{},ref1:"",ref2:"",startedAt:0,finishedAt:0};}
function load(){
  try{
    var raw=window.localStorage.getItem(KEY);if(!raw)return fresh();
    var s=JSON.parse(raw);
    if(!s||s.v!==2||!s.shares||s.shares.length!==5||typeof s.pos!=="number"||s.pos<0||s.pos>=STEPS.length||s.maxPos<s.pos||s.maxPos>=STEPS.length)return fresh();
    return s;
  }catch(e){return fresh();}
}
function save(){try{window.localStorage.setItem(KEY,JSON.stringify(S));}catch(e){/* private mode: keep going without saving */}}
function wipe(){try{window.localStorage.removeItem(KEY);}catch(e){}}
// Attempts survive "Start Over" so a replay with known prices shows on the submission card.
function bumpAttempt(){var n=1;try{n=(parseInt(window.localStorage.getItem(KEY+"_attempts"),10)||0)+1;window.localStorage.setItem(KEY+"_attempts",String(n));}catch(e){n=1;}return n;}

var S=load();
var UI={view:S.started?"resume":"welcome",qty:[0,0,0,0,0],sel:{},confirmLock:false,confirmRestart:false,animate:true,nameDraft:""};
var root=document.getElementById("root");

function step(){return STEPS[S.pos];}
function isLive(){return S.pos===S.maxPos;}
function go(n){S.pos=n;if(n>S.maxPos)S.maxPos=n;UI.confirmLock=false;UI.confirmRestart=false;UI.qty=[0,0,0,0,0];UI.animate=true;save();render();window.scrollTo(0,0);}
function score(){var n=0;QKEYS.forEach(function(k){if(S.answers[k]&&S.answers[k].ok)n++;});return n;}
function answered(){var n=0;QKEYS.forEach(function(k){if(S.answers[k])n++;});return n;}
function totals(){var t=0,sp=0;S.snaps.forEach(function(s){if(s){t+=s.trades;sp+=s.spread;}});return {trades:t,spread:r2(sp)};}

// ---------- validation of written answers ----------
function tokens(t){return (t.match(/[A-Za-z0-9$%'’.\-]+/g)||[]);}
function checkText(t,needEvidence){
  var w=tokens(t),n=w.length;
  if(n<MINWORDS)return {ok:false,n:n,msg:n+"/"+MINWORDS+" words. Write at least "+MINWORDS+"."};
  var seen={},distinct=0,real=0;
  w.forEach(function(x){
    var k=x.toLowerCase().replace(/[^a-z0-9]/g,"");
    if(k&&!seen[k]){seen[k]=1;distinct++;}
    if(/[0-9$%]/.test(x)||(/[aeiouy]/i.test(x)&&x.length<=20&&!/(.)\1\1\1/.test(x)))real++;
  });
  if(distinct<12)return {ok:false,n:n,msg:"This repeats the same few words. Explain it in your own sentences."};
  if(real/n<0.8)return {ok:false,n:n,msg:"Part of this is not readable words. Please write real sentences."};
  var common=(t.toLowerCase().match(/\b(the|a|an|and|or|but|to|of|in|on|is|are|was|were|it|that|this|i|my|me|we|you|not|because|when|so|for|with|as|at|by|if|can|could|would|had|have|did|do)\b/g)||[]).length;
  if(common<4)return {ok:false,n:n,msg:"This does not read as sentences yet. Explain your thinking in full sentences."};
  if(needEvidence&&!/\b(tech|bank|energy|retail|health|healthcare|round|rounds|earnings|fed|federal|rates?|fda|headline|news|announcement)\b/i.test(t))
    return {ok:false,n:n,msg:"Name at least one stock or news event from the simulation (for example TECH, BANK, or the Fed announcement)."};
  return {ok:true,n:n,msg:n+" words. Good to go."};
}

function niceStep(x){var p=Math.pow(10,Math.floor(Math.log(x)/Math.LN10)),f=x/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p;}
function chart(you,mkt){
  var W=340,H=200,L=52,R=12,T=10,B=26,labels=["Start","R0","R1","R2","R3"],i;
  var all=you.concat(mkt),lo=Math.min.apply(null,all),hi=Math.max.apply(null,all);
  if(hi-lo<200){var m=(hi+lo)/2;lo=m-100;hi=m+100;}
  var pad=(hi-lo)*0.12;lo-=pad;hi+=pad;
  var st=niceStep((hi-lo)/4);
  function X(k){return L+(W-L-R)*k/4;}
  function Y(v){return T+(H-T-B)*(1-(v-lo)/(hi-lo));}
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Line chart of your portfolio value and the buy-and-hold market value after each round" style="display:block;font-family:inherit">';
  for(var t=Math.ceil(lo/st)*st;t<=hi;t+=st){
    s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(t).toFixed(1)+'" y2="'+Y(t).toFixed(1)+'" stroke="#E3E6EA" stroke-width="1"/>'+
       '<text x="'+(L-6)+'" y="'+(Y(t)+3.5).toFixed(1)+'" text-anchor="end" font-size="10" fill="#63666A">$'+Math.round(t).toLocaleString("en-US")+'</text>';
  }
  if(START>lo&&START<hi)s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(START).toFixed(1)+'" y2="'+Y(START).toFixed(1)+'" stroke="#63666A" stroke-width="1" stroke-dasharray="2 3"/>';
  for(i=0;i<5;i++)s+='<text x="'+X(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="'+(i===0?"start":i===4?"end":"middle")+'" font-size="10" fill="#63666A">'+labels[i]+'</text>';
  function path(a){return a.map(function(v,k){return (k?"L":"M")+X(k).toFixed(1)+" "+Y(v).toFixed(1);}).join(" ");}
  s+='<path d="'+path(mkt)+'" fill="none" stroke="#005F83" stroke-width="2.5" stroke-dasharray="6 4" stroke-linejoin="round"/>';
  for(i=0;i<5;i++)s+='<rect x="'+(X(i)-3.5).toFixed(1)+'" y="'+(Y(mkt[i])-3.5).toFixed(1)+'" width="7" height="7" fill="#FFFFFF" stroke="#005F83" stroke-width="2"/>';
  s+='<path d="'+path(you)+'" fill="none" stroke="#154734" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>';
  for(i=0;i<5;i++)s+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(you[i]).toFixed(1)+'" r="4" fill="#72BF44" stroke="#154734" stroke-width="2"/>';
  return s+'</svg>';
}

     (o.beat?"Congratulations! But was it skill or luck? Could you replicate this performance tomorrow? Next week? Every year for 15 years?":
      o.tie?"You matched buy-and-hold. That is what an index fund does, with almost no effort. Was the extra effort of picking stocks worth it?":
      "Don't feel bad -- over 90% of actively managed large-cap U.S. funds trailed the S&amp;P 500 over the 15 years through 2024 (S&amp;P SPIVA).")+'</p></div>';
  [["1","Prices Adjust Instantly to Public Information","You witnessed semi-strong form market efficiency. The moment news became public, prices changed immediately."],
   ["2","Beating the Market Consistently Is Extremely Difficult","Over 90% of actively managed large-cap U.S. funds trailed the S&amp;P 500 over the 15 years through 2024 (S&amp;P SPIVA scorecard)."],
   ["3","Why Index Funds Make Sense for Most Investors","Index funds match the market's return with minimal cost. You don't need to time the market or manage emotions. Historically averages 10% annually."]].forEach(function(l,k){
    h+='<div class="card lesson slide-up" style="animation-delay:'+(k*0.15)+'s;margin-bottom:8px"><div class="num">'+l[0]+'</div><div><div style="font-weight:bold;font-size:13px;color:#154734;margin-bottom:2px">'+l[1]+'</div><div style="font-size:11px;line-height:1.4">'+l[2]+'</div></div></div>';
  });
  h+='<div class="card"><div class="cap">ROUND-BY-ROUND HISTORY</div>'+roundTable(false)+
     '<p style="font-size:11px;margin-top:8px">Check questions: <b style="color:#154734">'+score()+' of '+QKEYS.length+'</b> correct on the first try.</p></div>';
  h+='<button type="button" class="btn" data-a="'+(isLive()?"next":"fwd")+'">Continue to Reflection &rarr;</button>';
  h+='</div></div>';
  return h;
}

function vReflect(){
  var st=reflectState();
  var h='<div class="screen light"><div class="wrap pad fade-in">'+
    '<button type="button" class="lnk dark" data-a="back">&larr; Back to Results</button>'+
    '<div class="center" style="margin-bottom:20px"><div class="eyebrow" style="color:#005F83">REFLECTION</div>'+
    '<h2 style="font-size:24px;color:#154734;margin:6px 0">Connect Your Experience to EMH</h2>'+
    '<p style="font-size:13px">Answer both questions thoughtfully. Your responses will appear on your final submission card.</p></div>'+
    '<div class="tint bar" style="margin-bottom:20px"><div class="cap" style="letter-spacing:1px;font-size:10px">REMEMBER</div><div style="font-size:12px;line-height:1.5">The <strong style="color:#154734">Efficient Market Hypothesis</strong> states that asset prices fully reflect all available information. In its <strong style="color:#154734">semi-strong form</strong>, all publicly available information (news, earnings, Fed announcements) is instantly priced in, making it nearly impossible to profit from public news.</div></div>'+
    '<div style="margin-bottom:20px"><label for="ref1" style="display:block;font-size:13px;font-weight:bold;color:#154734;margin-bottom:6px;line-height:1.4">1. Based on your experience in this simulation, how does the Efficient Market Hypothesis explain your results? Which specific moments illustrated EMH in action?</label>'+
    '<textarea id="ref1" data-in="ref1" class="'+(st.a.ok?"ok":"")+'" placeholder="Reflect on how prices reacted to news, whether you could have profited from public information, and what your results say about market efficiency...">'+esc(S.ref1)+'</textarea>'+
    '<div id="c1" class="count'+(st.a.ok?" ok":"")+'">'+st.a.msg+'</div></div>'+
    '<div style="margin-bottom:20px"><label for="ref2" style="display:block;font-size:13px;font-weight:bold;color:#154734;margin-bottom:6px;line-height:1.4">2. Do you have any doubts about EMH? Can you think of real-world situations where markets might NOT be efficient? Explain your reasoning.</label>'+
    '<textarea id="ref2" data-in="ref2" class="'+(st.b.ok?"ok":"")+'" placeholder="Consider events like GameStop (2021), meme stocks, crypto crashes, or behavioral biases like panic selling. Does EMH always hold, or are there exceptions?">'+esc(S.ref2)+'</textarea>'+
    '<div id="c2" class="count'+(st.b.ok?" ok":"")+'">'+st.b.msg+'</div></div>'+
    '<button type="button" id="gen" class="btn" data-a="card"'+(st.ok?"":" disabled")+'>Generate Submission Card &rarr;</button>'+
    '<p class="note">Each response needs at least '+MINWORDS+' words in real sentences. Answer 1 must name a stock or news event from the simulation.</p>'+
    '</div></div>';
  return h;
}

function vCard(){
  var o=outcome(),tt=totals(),when="",mins=0;
  try{var dt=new Date(S.finishedAt);when=dt.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})+", "+dt.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});}catch(e){when="";}
  mins=Math.max(1,Math.round((S.finishedAt-S.startedAt)/60000));
  var h='<div class="screen light"><div class="wrap pad fade-in"><div class="rhead">'+
    '<div class="rtop" style="padding:14px"><div class="eyebrow" style="font-size:10px">FIN 2150 | CHAPTER 14 TRADING SIMULATION</div><h2 style="font-size:20px">'+esc(S.name)+'\'s Submission</h2>'+
    '<div style="font-size:10px;color:#B1E4E3;margin-top:4px">Completed '+when+' &middot; '+mins+' min &middot; Attempt '+(S.attempt||1)+'</div></div>'+
    '<div class="grid3"><div class="cell" style="background:#154734;padding:12px 6px"><b style="font-size:21px;color:'+(o.my>=0?"#72BF44":"#FF8A7A")+'">'+pct(o.my)+'</b><small>Your Return</small></div>'+
    '<div class="cell" style="background:#005F83;padding:12px 6px"><b style="font-size:21px;color:#FFFFFF">'+pct(BENCH.ret)+'</b><small>Market Return</small></div>'+
    '<div class="cell" style="background:'+(o.beat?"rgba(114,191,68,.2)":o.tie?"#F0F2F5":"rgba(192,57,43,.12)")+';padding:12px 6px"><b style="font-size:21px;color:'+(o.beat||o.tie?"#154734":"#C0392B")+'">'+(o.tie?"TIED":o.beat?"BEAT":"LOST")+'</b><small style="color:#63666A">vs. Market</small></div></div>'+
    '<div style="padding:10px 14px">'+roundTable(true)+
    '<div style="font-size:11px;margin-top:6px;line-height:1.5">Check questions: <b style="color:#154734">'+score()+'/'+QKEYS.length+'</b> &middot; Trades: <b style="color:#154734">'+tt.trades+'</b> &middot; Spreads paid: <b style="color:#154734">'+fmt(tt.spread)+'</b><br>Plan: '+(S.plan!=null?PLANS[S.plan]:"")+'</div></div>'+
    '<div class="rsec" style="border-top:2px solid #154734"><small>REFLECTION 1: EMH AND YOUR RESULTS</small><div>'+esc(S.ref1.trim())+'</div></div>'+
    '<div class="rsec"><small>REFLECTION 2: DOUBTS ABOUT EMH</small><div>'+esc(S.ref2.trim())+'</div></div>'+
    '<div style="padding:8px;text-align:center;background:#154734"><span style="font-size:10px;font-weight:bold;color:#72BF44">SCREENSHOT THIS CARD AND SUBMIT TO CANVAS</span></div></div>'+
    '<p class="note" style="margin:0 0 10px">If the card does not fit on one screen, take two screenshots or zoom out. Starting over counts as a new attempt, and the attempt number shows on the card.</p>'+
    '<button type="button" class="btn ghost" data-a="back">Edit Reflections</button>'+restartBlock()+
    '</div></div>';
  return h;
}

function render(){
  var h;
  if(UI.view!=="sim")h=vWelcome();
  else{
    var t=step().t;
    h=t==="trade"?vTrade():t==="news"?vNews():t==="debrief"?vDebrief():t==="results"?vResults():t==="reflect"?vReflect():vCard();
  }
  root.className=UI.animate?"anim":"";
  root.innerHTML=h;
  UI.animate=false;
}

// ---------- actions ----------
function trade(i,side){
  var r=step().r,q=UI.qty[i];
  if(step().t!=="trade"||!isLive()||!(q>0))return;
  if(side==="B"){if(!canBuy(i))return;S.cash=r2(S.cash-q*ROUNDS[r].ask[i]);S.shares[i]+=q;}
  else{if(!canSell(i))return;S.cash=r2(S.cash+q*ROUNDS[r].bid[i]);S.shares[i]-=q;}
  S.log.push({i:i,s:side,q:q});
  UI.qty[i]=0;UI.confirmLock=false;save();render();
}
var ACT={
  start:function(){if(!nameOk(UI.nameDraft))return;S=fresh();S.started=true;S.name=UI.nameDraft.trim().replace(/\s+/g," ");S.startedAt=Date.now();S.attempt=bumpAttempt();UI.view="sim";UI.sel={};go(0);},
  resume:function(){UI.view="sim";UI.animate=true;render();window.scrollTo(0,0);},
  restart:function(){UI.confirmRestart=true;render();},
  restartno:function(){UI.confirmRestart=false;render();},
  restartyes:function(){wipe();S=fresh();UI={view:"welcome",qty:[0,0,0,0,0],sel:{},confirmLock:false,confirmRestart:false,animate:true,nameDraft:""};render();window.scrollTo(0,0);},
  back:function(){if(S.pos>0)go(S.pos-1);},
  fwd:function(){if(S.pos<S.maxPos)go(S.pos+1);},
  current:function(){go(S.maxPos);},
  next:function(){
    var st=step();
    if(!isLive())return;
    if((st.t==="news"&&!S.answers["n"+st.r])||(st.t==="debrief"&&!S.answers["d"+st.r]))return;
    go(S.pos+1);
  },
  pick:function(i,el){var k=el.getAttribute("data-k");if(S.answers[k])return;UI.sel[k]=i;render();},
  lockans:function(i,el){
    var k=el.getAttribute("data-k"),st=step();
    if(S.answers[k]||UI.sel[k]==null)return;
    var q=st.t==="news"?NEWS[st.r].q:DEBRIEFS[st.r].q;
    S.answers[k]={c:UI.sel[k],ok:UI.sel[k]===q.correct};save();render();
  },
  plan:function(i){if(isLive()&&step().t==="trade"&&step().r===0){S.plan=i;save();render();}},
  max:function(i){var r=step().r,m=Math.floor((S.cash+1e-6)/ROUNDS[r].ask[i]);if(m>0){UI.qty[i]=m;render();}},
  all:function(i){if(S.shares[i]>0){UI.qty[i]=S.shares[i];render();}},
  buy:function(i){trade(i,"B");},
  sell:function(i){trade(i,"S");},
  undo:function(){S.cash=S.roundStart.cash;S.shares=S.roundStart.shares.slice();S.log=[];UI.qty=[0,0,0,0,0];UI.confirmLock=false;save();render();},
  lock:function(){UI.confirmLock=true;render();},
  lockno:function(){UI.confirmLock=false;render();},
  lockyes:function(){
    var st=step();if(st.t!=="trade"||!isLive())return;
    var r=st.r,held=false,sp=0;
    S.shares.forEach(function(x){if(x>0)held=true;});
    if(r===0&&(!held||S.plan==null))return;
    S.log.forEach(function(t){if(t.s==="B")sp+=t.q*(ROUNDS[r].ask[t.i]-ROUNDS[r].bid[t.i]);});
    S.snaps[r]={cash:S.cash,shares:S.shares.slice(),value:valueAt(S.cash,S.shares,r),trades:S.log.length,spread:r2(sp)};
    S.log=[];S.roundStart={cash:S.cash,shares:S.shares.slice()};
    go(S.pos+1);
  },
  card:function(){if(!reflectState().ok)return;S.finishedAt=Date.now();go(S.pos+1);}
};
root.addEventListener("click",function(e){
  var el=e.target;
  while(el&&el!==root&&!(el.getAttribute&&el.getAttribute("data-a")))el=el.parentNode;
  if(!el||el===root||el.disabled)return;
  var a=el.getAttribute("data-a"),i=parseInt(el.getAttribute("data-i"),10);
  if(ACT[a])ACT[a](i,el);
});
root.addEventListener("input",function(e){
  var el=e.target,k=el.getAttribute&&el.getAttribute("data-in");
  if(!k)return;
  if(k==="name"){UI.nameDraft=el.value;var b=document.getElementById("begin");if(b)b.disabled=!nameOk(el.value);}
  else if(k==="qty"){
    var i=parseInt(el.getAttribute("data-i"),10),v=parseInt(el.value,10);
    UI.qty[i]=(isNaN(v)||v<0)?0:v;
    var bb=document.getElementById("buy"+i),sb=document.getElementById("sell"+i),c=document.getElementById("cost"+i);
    if(bb)bb.disabled=!canBuy(i);if(sb)sb.disabled=!canSell(i);if(c)c.innerHTML=costLine(i);
  }
  else if(k==="ref1"||k==="ref2"){
    S[k]=el.value;save();
    var st=reflectState(),t1=document.getElementById("ref1"),t2=document.getElementById("ref2"),c1=document.getElementById("c1"),c2=document.getElementById("c2"),g=document.getElementById("gen");
    if(t1)t1.className=st.a.ok?"ok":"";if(t2)t2.className=st.b.ok?"ok":"";
    if(c1){c1.className="count"+(st.a.ok?" ok":"");c1.textContent=st.a.msg;}
    if(c2){c2.className="count"+(st.b.ok?" ok":"");c2.textContent=st.b.msg;}
    if(g)g.disabled=!st.ok;
  }
});
root.addEventListener("keydown",function(e){
  if(e.key==="Enter"&&e.target&&e.target.id==="name"){ACT.start();}
});
render();
})();
</script>
</body>
